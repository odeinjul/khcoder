# MariaDB settings for the bundled server (dep\mysql\khc.ini).
# kh_lib\kh_all_in_one.pm rewrites basedir, datadir, tmpdir, secure-file-priv
# and the heap table size on every start, so keep those lines in "key = value" form.
# (It replaces any line mentioning the heap table option, so don't name it in comments.)

[mysqld]
basedir = ./
datadir = ./data/
tmpdir = ./tmp/
secure-file-priv = ./screen/
port = 3307
bind-address = 127.0.0.1
character-set-server = utf8mb4
collation-server = utf8mb4_general_ci
sql_mode = STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
local_infile = 1
max_heap_table_size = 512M
tmp_table_size = 512M
key_buffer_size = 64M
innodb_buffer_pool_size = 256M
max_allowed_packet = 64M
skip-log-bin

[client]
port = 3307
